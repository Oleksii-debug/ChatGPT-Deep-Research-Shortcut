name: Test extension logic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Validate manifest JSON
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); if(m.commands?.['activate-deep-research']?.suggested_key?.windows!=='Ctrl+Shift+U') process.exit(1);"

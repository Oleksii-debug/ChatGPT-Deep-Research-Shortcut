name: Test extension logic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in src/*.js tests/*.cjs; do
            node --check "$file"
          done
      - name: Run unit, runtime and accessibility contract tests
        run: npm test

  package:
    name: Package tested extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run release gate
        run: |
          set -e
          for file in src/*.js tests/*.cjs; do
            node --check "$file"
          done
          npm test
      - name: Package extension
        run: |
          set -e
          mkdir -p dist/package
          cp manifest.json LICENSE README.md dist/package/
          cp -R src dist/package/src
          cd dist/package
          zip -r ../chatgpt-accessible-tool-picker-v0.3.0.zip .
          cd ..
          sha256sum chatgpt-accessible-tool-picker-v0.3.0.zip > chatgpt-accessible-tool-picker-v0.3.0.sha256
      - name: Upload tested ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-accessible-tool-picker-v0.3.0
          path: |
            dist/chatgpt-accessible-tool-picker-v0.3.0.zip
            dist/chatgpt-accessible-tool-picker-v0.3.0.sha256
          if-no-files-found: error

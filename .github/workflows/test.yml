name: Test extension logic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/background.js
          node --check src/matcher.js
          node --check src/content.js
          node --check tests/matcher.test.cjs
          node --check tests/accessibility.test.cjs
          node --check tests/manifest.test.cjs
      - name: Run unit and contract tests
        run: npm test
      - name: Package extension
        run: |
          mkdir -p dist/package
          cp manifest.json LICENSE README.md dist/package/
          cp -R src dist/package/src
          cd dist/package
          zip -r ../chatgpt-accessible-tool-picker-v0.2.0.zip .
      - name: Upload tested ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-accessible-tool-picker-v0.2.0
          path: dist/chatgpt-accessible-tool-picker-v0.2.0.zip
          if-no-files-found: error
